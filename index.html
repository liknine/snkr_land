  <script id="stage47-main-catalog-men-only">
/* STAGE47_MAIN_CATALOG_MEN_ONLY
 * STAGE47_1_FORCE_PAIR_CACHE_REFRESH
 * Keep the complete production catalog on the server, but hide women-section
 * stock from the client-facing main catalog. Force a fresh products.json read
 * so Telegram WebView cannot keep the pre-repair men/women distribution.
 */
(function () {
  'use strict';
  if (window.__stage47MainCatalogMenOnlyInstalledV2) return;
  window.__stage47MainCatalogMenOnlyInstalledV2 = true;

  var originalFetch = window.fetch.bind(window);
  var revision = 'stage47_1_force_pairs_20260801';

  function normalizeSection(value) {
    return String(value == null ? '' : value)
      .trim()
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[._-]+/g, ' ')
      .replace(/\s+/g, ' ');
  }

  function isWomenProduct(product) {
    if (!product || typeof product !== 'object') return false;
    if (product.mainCatalogVisible === false || product.main_catalog_visible === false ||
        String(product.mainCatalogVisible).toLowerCase() === 'false' ||
        String(product.main_catalog_visible).toLowerCase() === 'false') return true;

    var values = [
      product.section, product.catalogSection, product.catalog_section,
      product.shoeSection, product.shoe_section, product.gender,
      product.department, product.group, product.category
    ];
    return values.some(function (rawValue) {
      var section = normalizeSection(rawValue);
      return section === 'women' || section === 'woman' || section === 'female' ||
        section === 'womens' || section === "women's" ||
        section.indexOf('жен') !== -1;
    });
  }

  function productsUrl(input) {
    try {
      var rawUrl = typeof input === 'string' ? input : (input && input.url) || '';
      var url = new URL(rawUrl, window.location.href);
      if (!/(?:^|\/)(?:data\/)?products\.json$/i.test(url.pathname)) return null;
      return url;
    } catch (error) {
      return null;
    }
  }

  function filterPayload(payload) {
    if (Array.isArray(payload)) {
      return payload.filter(function (product) { return !isWomenProduct(product); });
    }
    if (payload && typeof payload === 'object' && Array.isArray(payload.products)) {
      var copy = Object.assign({}, payload);
      copy.products = payload.products.filter(function (product) { return !isWomenProduct(product); });
      return copy;
    }
    return payload;
  }

  function freshArgs(args) {
    var url = productsUrl(args[0]);
    if (!url) return args;
    url.searchParams.set('_sl_catalog_revision', revision);
    var init = Object.assign({}, args[1] || {});
    init.cache = 'no-store';
    var headers = new Headers(init.headers || (args[0] instanceof Request ? args[0].headers : undefined));
    headers.set('cache-control', 'no-cache, no-store, max-age=0');
    headers.set('pragma', 'no-cache');
    init.headers = headers;
    if (args[0] instanceof Request) {
      args[0] = new Request(url.toString(), args[0]);
      args[1] = init;
    } else {
      args[0] = url.toString();
      args[1] = init;
    }
    return args;
  }

  if ('caches' in window) {
    caches.keys().then(function (names) {
      return Promise.all(names.map(function (name) {
        return caches.open(name).then(function (cache) {
          return cache.keys().then(function (requests) {
            return Promise.all(requests.map(function (request) {
              return productsUrl(request) ? cache.delete(request) : false;
            }));
          });
        });
      }));
    }).catch(function () {});
  }

  window.fetch = async function () {
    var args = freshArgs(Array.prototype.slice.call(arguments));
    var response = await originalFetch.apply(window, args);
    if (!response || !response.ok || !productsUrl(args[0])) return response;

    try {
      var payload = await response.clone().json();
      var filtered = filterPayload(payload);
      var headers = new Headers(response.headers || {});
      headers.delete('content-length');
      headers.delete('content-encoding');
      headers.set('cache-control', 'no-store, no-cache, must-revalidate, max-age=0');
      headers.set('pragma', 'no-cache');
      if (!headers.get('content-type')) headers.set('content-type', 'application/json; charset=utf-8');
      return new Response(JSON.stringify(filtered), {
        status: response.status,
        statusText: response.statusText,
        headers: headers
      });
    } catch (error) {
      console.warn('[Stage47.1] products.json visibility/cache guard fallback', error);
      return response;
    }
  };
})();
</script>
